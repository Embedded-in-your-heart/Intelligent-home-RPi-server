[project]
name = "home-server"
version = "0.1.0"
description = "Intelligent Home RPi Server — BLE central + web UI"
requires-python = ">=3.11"
# 註：開發採用 Python 3.12 (.python-version)，因 3.11.x 的 site.py 在非 ASCII 路徑上
# 讀取 .pth 檔會以 locale 編碼 (cp950) 解碼失敗；3.12 起改為 UTF-8。
# 程式碼仍維持 3.11 相容，因 RPi OS Bookworm 內建 3.11。
dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "bcrypt>=4.1",
    "simple-websocket>=1.0",
    "bluepy>=1.3.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"  # 保持與 RPi 部署相容

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["flask_login.*", "flask_wtf.*", "wtforms.*", "bluepy.*"]
ignore_missing_imports = true
