version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Sync uv dependencies
    cmds:
      - uv sync

  run:
    desc: Start the dev server (loads .env)
    cmds:
      - sudo -E .venv/bin/python3.12 -m home_server

  set-start:
    desc: "RPi only: install root @reboot crontab to auto-start the server on boot"
    cmds:
      - |
        chmod +x scripts/boot_start.sh
        ROOT="$(pwd)"
        BOOT="$ROOT/scripts/boot_start.sh"
        LOG="$ROOT/data/boot.log"
        MARKER="# intelligent-home-autostart"
        LINE="@reboot $BOOT >> $LOG 2>&1 $MARKER"
        # Capture the existing crontab first, drop any prior autostart line, then
        # rewrite — avoids reading and writing the crontab in one pipeline.
        EXISTING="$(sudo crontab -l 2>/dev/null | grep -vF "$MARKER" || true)"
        if [ -n "$EXISTING" ]; then
          printf '%s\n%s\n' "$EXISTING" "$LINE" | sudo crontab -
        else
          printf '%s\n' "$LINE" | sudo crontab -
        fi
        echo "installed: $LINE"

  unset-start:
    desc: "RPi only: remove the auto-start @reboot crontab entry"
    cmds:
      - |
        MARKER="# intelligent-home-autostart"
        REMAINING="$(sudo crontab -l 2>/dev/null | grep -vF "$MARKER" || true)"
        if [ -z "$REMAINING" ]; then
          sudo crontab -r 2>/dev/null || true
          echo "removed (crontab now empty)"
        else
          echo "$REMAINING" | sudo crontab -
          echo "removed autostart entry"
        fi

  test:
    desc: Run pytest
    cmds:
      - uv run pytest

  test:verbose:
    desc: Run pytest with -v
    cmds:
      - uv run pytest -v

  lint:
    desc: Ruff check
    cmds:
      - uv run ruff check src tests

  lint:fix:
    desc: Ruff check with autofix
    cmds:
      - uv run ruff check --fix src tests

  fmt:
    desc: Ruff format
    cmds:
      - uv run ruff format src tests

  typecheck:
    desc: mypy strict on src/
    cmds:
      - uv run mypy src

  ci:
    desc: Lint + typecheck + tests (what CI would run)
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  scan:
    desc: "RPi only: BLE scan and print discovered devices (arg: duration_s, default 5)"
    cmds:
      - uv run python scripts/scan_ble.py {{.CLI_ARGS}}

  clean:
    desc: Remove caches and the dev SQLite file
    cmds:
      - rm -rf .pytest_cache .ruff_cache .mypy_cache
      - rm -f data/home.db data/home.db-journal data/home.db-wal data/home.db-shm
