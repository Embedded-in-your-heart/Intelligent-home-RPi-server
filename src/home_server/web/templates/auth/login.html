{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
<form method="post">
  {{ form.csrf_token }}
  <p>{{ form.username.label }} {{ form.username() }}</p>
  <p>{{ form.password.label }} {{ form.password() }}</p>
  <button type="submit">Login</button>
</form>
<a href="{{ url_for('auth.register') }}">Register</a>
{% endblock %}
