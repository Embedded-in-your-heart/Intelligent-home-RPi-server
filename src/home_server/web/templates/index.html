{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<p>Logged in as {{ current_user.username }}</p>
<form method="post" action="{{ url_for('auth.logout') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit">Logout</button>
</form>
{% endblock %}
